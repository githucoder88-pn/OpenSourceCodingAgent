project:
  name: my-project

orchestration:
  mode: supervisor
  max_agents: 6
  max_parallel_tasks: 4

models:
  primary:
    provider: openai
    model: gpt-4o

  fast:
    provider: ollama
    model: llama3.1

  reviewer:
    provider: anthropic
    model: claude-3-5-sonnet-20241022

routing:
  strategy: adaptive
  fallback: true
  cost_aware: true
  latency_aware: true

autonomy:
  default: workspace-write
  approval_policy: on-risky-commands

performance:
  low_resource_mode: false
  max_parallel_agents: 6
  max_context_cache_mb: 512
  background_indexing: true
  local_embeddings: false
  verbose_events: true
